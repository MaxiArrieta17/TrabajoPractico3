<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>Tienda Virtual - Home</title>
</head>
<body>

    <nav></nav>

    <main>
        <section class="main-banner">
            <h2>Bienvenido a la Tienda Virtual</h2>
            <p>Encontrá la mejor tecnología y componentes para tu setup.</p>
        </section>

        <section class="products-grid" id="contenedor-home">
            
            <article class="product-card">
                <img src="./images/pc.webp" alt="Producto Destacado"> 
                <div class="card-body">
                    <h3>PC Gamer</h3>
                    <p class="product-description">Procesador Ryzen 9, 32GB RAM, RTX 4080.</p>
                    <span class="price">$2.100.000</span>
                    
                    <div class="quantity-selector">
                        <button class="btn-qty" type="button" onclick="disminuirCantidad(this)">-</button>
                        <input type="number" value="1" min="1" readonly>
                        <button class="btn-qty" type="button" onclick="aumentarCantidad(this)">+</button>
                    </div>
                    
                    <button class="btn-add">Añadir al carrito</button>
                </div>
            </article>

            <article class="product-card">
                <img src="./images/monitor.webp" alt="Producto Destacado">
                <div class="card-body">
                    <h3>Monitor</h3>
                    <p class="product-description">27 pulgadas, 4K Ultra HD, 144Hz, curvo.</p>
                    <span class="price">$700.000</span>
                    
                    <div class="quantity-selector">
                        <button class="btn-qty" type="button" onclick="disminuirCantidad(this)">-</button>
                        <input type="number" value="1" min="1" readonly>
                        <button class="btn-qty" type="button" onclick="aumentarCantidad(this)">+</button>
                    </div>

                    <button class="btn-add">Añadir al carrito</button>
                </div>
            </article>

            <article class="product-card">
                <img src="./images/mouse.webp" alt="Producto Destacado">
                <div class="card-body">
                    <h3>Mouse Gamer</h3>
                    <p class="product-description">Inalámbrico, ergonómico, batería de larga duración.</p>
                    <span class="price">$75.000</span>
                    
                    <div class="quantity-selector">
                        <button class="btn-qty" type="button" onclick="disminuirCantidad(this)">-</button>
                        <input type="number" value="1" min="1" readonly>
                        <button class="btn-qty" type="button" onclick="aumentarCantidad(this)">+</button>
                    </div>

                    <button class="btn-add">Añadir al carrito</button>
                </div>
            </article>

        </section>
    </main>
    <script src="js/navbar.js"></script>
    <script src="js/home.js"></script>

</body>
</html>
