<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tienda Virtual - Home</title>
</head>
<body>

    <nav>
        <div class="logo-container">
            <img src="./assets/logo.webp" alt="Logo" width="50">
            <h1>Tienda Virtual</h1>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="categoria1.html">PC's</a>
            <a href="categoria2.html">Monitores</a>
            <a href="categoria3.html">Periféricos</a>
            <a href="registro.html">Registro</a>
            <a href="login.html">Login</a>
            <a href="#">Logout</a>
        </div>
    </nav>

    <main>
        <section class="main-banner">
            <h2>Bienvenido a la Tienda Virtual</h2>
            <p>Encontrá la mejor tecnología y componentes para tu setup.</p>
        </section>

        <section class="products-grid">
            
            <article class="product-card">
                <img src="./assets/pc.webp" alt="Producto Destacado"> 
                <div class="card-body">
                    <h3>PC Gamer</h3>
                    <span class="price">$2.100.000</span>
                    <button>Ver Detalles</button>
                </div>
            </article>

            <article class="product-card">
                <img src="./assets/monitor.webp" alt="Producto Destacado">
                <div class="card-body">
                    <h3>Monitor 180Hz</h3>
                    <span class="price">$700.000</span>
                    <button>Ver Detalles</button>
                </div>
            </article>

            <article class="product-card">
                <img src="./assets/mouse.webp" alt="Producto Destacado">
                <div class="card-body">
                    <h3>Teclado Mecánico</h3>
                    <span class="price">$75.000</span>
                    <button>Ver Detalles</button>
                </div>
            </article>

        </section>
    </main>

</body>
</html>
