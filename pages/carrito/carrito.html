<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <title>Tienda Virtual - Mi Carrito</title>
</head>
<body>

    <nav></nav>

    <main>
        <section class="main-banner">
            <h2>Tu Carrito de Compras</h2>
            <p>Revisá tus productos antes de finalizar la compra.</p>
        </section>

        <section class="products-grid" id="contenedor-carrito">
            </section>

        <section style="text-align: center; margin: 30px 0;">
            <h3 id="total-carrito" style="font-size: 1.8rem; color: #1a237e;">Total: $0</h3>
            
            <div style="display: flex; justify-content: center; gap: 20px; margin-top: 15px;">
                <button id="vaciar-carrito-btn" class="btn-vaciar">Vaciar Carrito</button>
                <button id="terminar-compra-btn" class="btn-terminar">Terminar Compra</button>
            </div>
        </section>
    </main>

    <script src="../../js/navbar.js"></script>
    <script src="../../js/carrito.js"></script>

</body>
</html>
