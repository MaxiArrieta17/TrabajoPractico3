<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/styles.css">
    <title>Tienda VirtualS - Perifericos</title>
</head>
<body>

    <nav></nav>

    <main>
        <section class="main-banner">
            <h2>Explora nuestros periféricos</h2>
            <p>Los mejores productos seleccionados para vos.</p>
        </section>

        <section class="products-grid cat-perifericos">
            
            <article class="product-card">
                <img src="/images/mouse.webp" alt="Producto 1">
                <div class="card-body">
                    <h3>Mouse A</h3>
                    <span class="price">$50.000</span>
                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

            <article class="product-card">
                <img src="/images/mouse.webp" alt="Producto 2">
                <div class="card-body">
                    <h3>Mouse B</h3>
                    <span class="price">$75.000</span>
                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

            <article class="product-card">
                <img src="/images/mouse.webp" alt="Producto 3">
                <div class="card-body">
                    <h3>Mouse C</h3>
                    <span class="price">$20.500</span>
                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

        </section>
    </main>
    <script src="/js/navbar.js"></script>

</body>
</html>
