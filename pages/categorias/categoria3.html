<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <title>Tienda Virtual - Perifericos</title>
</head>
<body>

    <nav></nav>

    <main>
        <section class="main-banner">
            <h2>Explora nuestros periféricos</h2>
            <p>Los mejores productos seleccionados para vos.</p>
        </section>

        <section class="products-grid">
            
            <article class="product-card">
                <img src="../../images/mouse.webp" alt="Mouse A">
                <div class="card-body">
                    <h3>Mouse A</h3>
                    <p class="product-description">Sensor óptico 3200 DPI, luces RGB, 6 botones.</p>
                    <span class="price">$50.000</span>
                    
                    <div class="quantity-selector">
                        <button class="btn-qty" type="button" onclick="disminuirCantidad(this)">-</button>
                        <input type="number" value="1" min="1" readonly>
                        <button class="btn-qty" type="button" onclick="aumentarCantidad(this)">+</button>
                    </div>

                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

            <article class="product-card">
                <img src="../../images/mouse.webp" alt="Mouse B">
                <div class="card-body">
                    <h3>Mouse B</h3>
                    <p class="product-description">Inalámbrico, ergonómico, batería de larga duración.</p>
                    <span class="price">$75.000</span>
                    
                    <div class="quantity-selector">
                        <button class="btn-qty" type="button" onclick="disminuirCantidad(this)">-</button>
                        <input type="number" value="1" min="1" readonly>
                        <button class="btn-qty" type="button" onclick="aumentarCantidad(this)">+</button>
                    </div>

                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

            <article class="product-card">
                <img src="../../images/mouse.webp" alt="Mouse C">
                <div class="card-body">
                    <h3>Mouse C</h3>
                    <p class="product-description">Compacto, ideal para oficina y viajes.</p>
                    <span class="price">$20.500</span>
                    
                    <div class="quantity-selector">
                        <button class="btn-qty" type="button" onclick="disminuirCantidad(this)">-</button>
                        <input type="number" value="1" min="1" readonly>
                        <button class="btn-qty" type="button" onclick="aumentarCantidad(this)">+</button>
                    </div>

                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

        </section>
    </main>

    <script src="../../js/navbar.js"></script>

</body>
</html>
