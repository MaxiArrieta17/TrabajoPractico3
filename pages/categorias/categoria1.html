<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/styles.css">
    <title>Tienda Virtual - PC's</title>
</head>
<body>

    <nav></nav>

    <main>
        <section class="main-banner">
            <h2>Explora nuestras PC's</h2>
            <p>Los mejores productos seleccionados para vos.</p>
        </section>

        <section class="products-grid">
            
            <article class="product-card">
                <img src="/images/pc.webp" alt="Producto 1">
                <div class="card-body">
                    <h3>PC Gamer A</h3>
                    <span class="price">$900.000</span>
                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

            <article class="product-card">
                <img src="/images/pc.webp" alt="Producto 2">
                <div class="card-body">
                    <h3>PC Gamer B</h3>
                    <span class="price">$1.350.900</span>
                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

            <article class="product-card">
                <img src="/images/pc.webp" alt="Producto 3">
                <div class="card-body">
                    <h3>PC Gamer C</h3>
                    <span class="price">$2.100.000</span>
                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

        </section>
    </main>
    <script src="/js/navbar.js"></script>

</body>
</html>
