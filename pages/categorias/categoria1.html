<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/styles.css">
    <title>Tienda Virtual - PC's</title>
</head>
<body>

    <nav></nav>

    <main>
        <section class="main-banner">
            <h2>Explora nuestras PC's</h2>
            <p>Los mejores productos seleccionados para vos.</p>
        </section>

        <section class="products-grid">
            
            <article class="product-card">
                <img src="../../images/pc.webp" alt="PC Gamer A">
                <div class="card-body">
                    <h3>PC Gamer A</h3>
                    <p class="product-description">Procesador i5, 8GB RAM, SSD 480GB.</p>
                    <span class="price">$900.000</span>
                    
                    <div class="quantity-selector">
                        <button class="btn-qty" type="button" onclick="disminuirCantidad(this)">-</button>
                        <input type="number" value="1" min="1" readonly>
                        <button class="btn-qty" type="button" onclick="aumentarCantidad(this)">+</button>
                    </div>

                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

            <article class="product-card">
                <img src="../../images/pc.webp" alt="PC Gamer B">
                <div class="card-body">
                    <h3>PC Gamer B</h3>
                    <p class="product-description">Procesador i7, 16GB RAM, SSD 1TB.</p>
                    <span class="price">$1.350.000</span>
                    
                    <div class="quantity-selector">
                        <button class="btn-qty" type="button" onclick="disminuirCantidad(this)">-</button>
                        <input type="number" value="1" min="1" readonly>
                        <button class="btn-qty" type="button" onclick="aumentarCantidad(this)">+</button>
                    </div>

                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

            <article class="product-card">
                <img src="../../images/pc.webp" alt="PC Gamer C">
                <div class="card-body">
                    <h3>PC Gamer C</h3>
                    <p class="product-description">Procesador Ryzen 9, 32GB RAM, RTX 4080.</p>
                    <span class="price">$2.100.000</span>
                    
                    <div class="quantity-selector">
                        <button class="btn-qty" type="button" onclick="disminuirCantidad(this)">-</button>
                        <input type="number" value="1" min="1" readonly>
                        <button class="btn-qty" type="button" onclick="aumentarCantidad(this)">+</button>
                    </div>

                    <button class="btn-add">Ver detalle</button>
                </div>
            </article>

        </section>
    </main>

    <script src="../../js/navbar.js"></script>

</body>
</html>
